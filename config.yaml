# Daily Medical Imaging AI Paper Radar configuration
# Use a 180-day search window plus data/sent_papers.json dedupe. Brain imaging
# papers update daily, while total-body PET / multi-organ trajectory papers are
# sparse and benefit from a longer rolling window.

lookback_days: 180
state_path: data/sent_papers.json
state_namespace: brain_image_all_methods_v3

site:
  title: "Brain Image / Neuroimage Paper Radar"
  output_dir: site
  max_papers: 35
  use_sent_state: true
  min_preprints: 2
  max_per_topic: 12
  max_per_source: 24
  max_per_venue_category: 24
  allowed_venue_categories:
    - flagship_main
    - flagship_subjournal
    - top_imaging_ai
    - preprint

