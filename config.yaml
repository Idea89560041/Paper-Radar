# Daily Medical Imaging AI Paper Radar configuration
# Use a 14-day search window plus data/sent_papers.json dedupe to reduce misses
# caused by delayed indexing in PubMed, Semantic Scholar, Crossref, and arXiv.

lookback_days: 14
state_path: data/sent_papers.json
state_namespace: neurodegenerative_pet_mri_v1

site:
  title: "Neurodegenerative PET/MRI Deep Learning Paper Radar"
  output_dir: site
  max_papers: 25
  use_sent_state: true
  min_preprints: 0
  max_per_topic: 8
  max_per_source: 18
  max_per_venue_category: 18

research_profile:
  name: "Neurodegenerative Disease PET/MRI Deep Learning"

  queries:
    - "Alzheimer disease dementia MCI brain MRI PET deep learning"
    - "neurodegenerative disease brain MRI PET artificial intelligence"
    - "Aβ-PET amyloid beta PET Alzheimer dementia deep learning"
