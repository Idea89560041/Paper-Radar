name: Daily Medical-AI Paper Radar Site

on:
  push:
    branches: [main]
    paths:
      - "paper_bot.py"
      - "config.yaml"
      - "requirements.txt"
      - "README.md"
      - ".github/workflows/daily-paper-digest.yml"
  # 08:00 Singapore / Hong Kong / China time is 00:00 UTC.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      backfill_years:
        description: "Manual historical lookback in years. Use 0 for normal latest mode."
        required: false
        type: number
        default: "0"
      max_papers:
        description: "Maximum papers to publish on the site."
        required: false
        type: number
        default: "25"
      ignore_sent_state:
        description: "For manual backfill, include papers even if they were shown before."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build paper radar site
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: |
          BACKFILL_YEARS="${{ github.event.inputs.backfill_years || '0' }}"
          MAX_PAPERS="${{ github.event.inputs.max_papers || '25' }}"
          IGNORE_SENT_STATE="${{ github.event.inputs.ignore_sent_state || 'false' }}"

          ARGS=(--config config.yaml --web --output-dir site --site-max-papers "$MAX_PAPERS")

          if [[ "$BACKFILL_YEARS" != "0" ]]; then
            LOOKBACK_DAYS=$((BACKFILL_YEARS * 365))
            ARGS+=(
              --lookback-days "$LOOKBACK_DAYS"
              --state-namespace manual_backfill_recent_years_v1
              --site-max-per-topic "$MAX_PAPERS"
              --site-max-per-source "$MAX_PAPERS"
              --site-max-per-venue-category "$MAX_PAPERS"
            )
          fi

          if [[ "$IGNORE_SENT_STATE" == "true" ]]; then
            ARGS+=(--ignore-sent-state)
          fi

          python paper_bot.py "${ARGS[@]}"

      - name: Commit sent paper state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent_papers.json
          if git diff --cached --quiet; then
            echo "No sent-paper state changes to commit."
          else
            git commit -m "Update sent paper state [skip ci]"
            git push
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
